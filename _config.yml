title: "twohalv.es"
description: "A collection of writing."

url: "https://twohalv.es"
# Keep a dedicated origin so OG/canonical URLs stay production
# even when `jekyll serve` rewrites site.url to localhost.
canonical_url: "https://twohalv.es"
og_image: "/assets/og-image.png"

markdown: kramdown

include:
  - _pages

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

exclude:
  - favourite-ratio-server/
