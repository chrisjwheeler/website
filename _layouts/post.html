---
layout: default
---

<article class="article">

    <header class="article-header">
        <h1>
            {{ page.title }}
        </h1>


        {% if page.subtitle %}
        <p class="article-subtitle">
            {{ page.subtitle }}
        </p>
        {% endif %}

        {% include reading-stats.html %}
    </header>


    <div class="article-body">
        {{ content }}

    </div>

</article>
